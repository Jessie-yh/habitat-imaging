# IVIM habitat analysis, k = 4
# Uses vendor-exported D / D* / f maps (dataset.maps mode).

project:
  name: ivim_d_dstar_f_k4
  seed: 42
  output_dir: results/ivim_k4

dataset:
  root: data/raw
  case_glob: "*"
  roi_pattern: "{case}/roi.nii.gz"
  maps:
    - name: D
      pattern: "{case}/ivim_D.nii.gz"
    - name: D*
      pattern: "{case}/ivim_Dstar.nii.gz"
    - name: f
      pattern: "{case}/ivim_f.nii.gz"

resample:
  enabled: true
  target_spacing: [1.0, 1.0, 3.0]
  order_param: 3
  order_mask: 0

preprocessing:
  percentile_clip: [1.0, 99.0]
  minmax_scale: true
  fill_nonfinite: roi_median
  min_roi_voxels: 30

clustering:
  n_clusters: 4                 # fixed by the study design
  k_range: [2, 10]
  selection: mode
  evaluate: true
  n_init: 20
  max_samples_for_eval: 50000
  max_voxels_for_fit: 300000
  feature_space: normalized

metrics:
  volume: true
  parameter_stats: true
  msi: true
  ithscore: false

output:
  csv_encoding: utf-8-sig
  also_gbk: false
  save_plots: true
  save_habitat_maps: true
  max_case_figures: 20
